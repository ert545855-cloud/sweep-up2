services:
  - type: web
    name: swipeup
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: swipeup-kv
          property: connectionString
      # Kalıcı medya ve tam yedek için bir PostgreSQL bağlamak istersen:
      # - key: DATABASE_URL
      #   fromDatabase: { name: swipeup-db, property: connectionString }

  - type: keyvalue
    name: swipeup-kv
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

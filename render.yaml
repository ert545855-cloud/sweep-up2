services:
  - type: web
    name: swipeup
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: swipeup-db
          property: connectionString

databases:
  - name: swipeup-db
    plan: free
    region: frankfurt
